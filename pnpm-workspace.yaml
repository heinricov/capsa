packages:
  - "apps/*"
  - "configs/*"
  - "packages/*"

# NativeWind v5 RC hanya diuji dengan lightningcss ini. Versi lain
# menyebabkan "global.css: failed to deserialize" saat Metro membundel.
# Lihat: https://www.nativewind.dev/v5/getting-started/installation
overrides:
  lightningcss: "1.30.1"

# React Native/Metro works most reliably with a flat, non-symlinked
# node_modules. See: https://pnpm.io/settings#nodelinker
nodeLinker: hoisted

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  msw: false
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
